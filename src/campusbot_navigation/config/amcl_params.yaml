 amcl:
    ros__parameters:
      use_sim_time: true

      base_frame_id: "base_footprint"
      global_frame_id: "map"
      odom_frame_id: "odom"
      scan_topic: "scan"

      tf_broadcast: true
      robot_model_type: "nav2_amcl::DifferentialMotionModel"

      min_particles: 500
      max_particles: 2000

      max_beams: 60
      laser_model_type: "likelihood_field"
      laser_min_range: 0.12
      laser_max_range: 12.0

      update_min_d: 0.25
      update_min_a: 0.2
      transform_tolerance: 1.0


